<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"></script>

<!-- =========================================================
     1) CSS: el "diseño". Colores, tamaños, espacios.
     ========================================================= -->
<style>
  :root {
    --fondo: #f4f5f2;
    --tarjeta: #ffffff;
    --texto: #1c1f1a;
    --suave: #6b7166;
    --acento: #2f6f4f;      /* verde: color principal de la app */
    --acento-claro: #e3efe7;
    --borde: #e2e4de;
    --grupo: #8a5a00;       /* ámbar: superseries */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--fondo);
    color: var(--texto);
    line-height: 1.45;
  }
  header {
    background: var(--acento);
    color: white;
    padding: 20px 16px 14px;
  }
  header small { opacity: .8; letter-spacing: .04em; text-transform: uppercase; font-size: 12px; }
  header h1 { margin: 4px 0 2px; font-size: 22px; }
  header p { margin: 0; opacity: .9; font-size: 14px; }

  /* Pestañas para elegir el día */
  .tabs { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; background: var(--acento); }
  .tab {
    border: 0; border-radius: 999px; padding: 8px 14px; font-size: 14px; cursor: pointer;
    background: rgba(255,255,255,.15); color: white; white-space: nowrap;
  }
  .tab.activa { background: white; color: var(--acento); font-weight: 600; }

  main { padding: 16px; max-width: 640px; margin: 0 auto; }
  .titulo-dia { font-size: 18px; margin: 4px 0 8px; }
  .resumen { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .chip { background: var(--acento-claro); color: var(--acento); border-radius: 8px; padding: 6px 10px; font-size: 13px; }

  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--suave); margin: 24px 0 8px; }
  .nota-bloque { font-size: 14px; color: var(--suave); margin: -4px 0 8px; }

  .tarjeta {
    background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 14px;
    padding: 14px; margin-bottom: 10px;
  }
  .tarjeta h3 { margin: 0; font-size: 16px; }
  .etiqueta { font-size: 11px; background: var(--acento); color: white; border-radius: 6px; padding: 2px 6px; margin-left: 6px; vertical-align: middle; }
  .detalle { color: var(--suave); font-size: 14px; margin: 4px 0 0; }

  /* Superseries: borde de color a la izquierda para que se vean como un bloque */
  .tarjeta.en-grupo { border-left: 4px solid var(--grupo); }
  .etiqueta.grupo { background: var(--grupo); }

  /* Grilla de prescripción: series, carga, RIR, descanso */
  .presc { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
  .presc div { background: var(--fondo); border-radius: 8px; padding: 6px; text-align: center; }
  .presc span { display: block; font-size: 10px; color: var(--suave); text-transform: uppercase; }
  .presc b { font-size: 14px; }

  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--acento); font-size: 14px; font-weight: 600; }
  ul, ol { margin: 8px 0 0; padding-left: 18px; font-size: 14px; }
  .video { display: inline-block; margin-top: 10px; font-size: 14px; color: var(--acento); }

  .reglas { background: #fff8e6; border-color: #f0e2b8; }
  .reglas p { margin: 0 0 4px; font-size: 14px; }

  /* Etapa 6: selector de etapa, ejercicio nuevo, secciones de la descripción y recuadro de cierre */
  .selector-etapa { margin-top: 10px; width: auto; max-width: 100%; font-size: 15px; padding: 6px 8px; background: rgba(255,255,255,.95); border: 0; }
  .etiqueta.nuevo { background: #b54708; }
  .seccion-titulo { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--acento); margin: 10px 0 2px; }
  .cierre { background: var(--acento-claro); border-color: #c9e0d1; font-size: 14px; }
  .cierre b { display: block; margin-bottom: 4px; }

  /* ---- Registro de series (Fase 2) ---- */
  .registro { margin-top: 12px; border-top: 1px dashed var(--borde); padding-top: 10px; }
  .registro-titulo { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .fila-serie { display: grid; grid-template-columns: 54px 1fr 1fr; gap: 6px; align-items: center; margin-bottom: 6px; font-size: 13px; color: var(--suave); }
  input, textarea {
    width: 100%; font: inherit; font-size: 16px; /* 16px evita que el iPhone haga zoom */
    padding: 8px; border: 1px solid var(--borde); border-radius: 8px; background: var(--fondo); color: var(--texto);
  }
  textarea { min-height: 70px; resize: vertical; }
  .fila-rir { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-items: center; font-size: 13px; color: var(--suave); margin-top: 4px; }
  .fila-serie.con-rir { grid-template-columns: 54px 1fr 1fr 1fr; }
  .fila-anotar { display: grid; grid-template-columns: 1fr 110px; gap: 6px; align-items: center; font-size: 13px; color: var(--suave); margin-bottom: 6px; }
  .boton {
    display: block; width: 100%; border: 0; border-radius: 12px; padding: 14px; margin-top: 10px;
    font-size: 16px; font-weight: 600; cursor: pointer; background: var(--acento); color: white;
  }
  .boton.secundario { background: var(--acento-claro); color: var(--acento); }
  .aviso { font-size: 13px; color: var(--suave); margin: 8px 0 0; }
  /* ---- Modo entrenamiento (24/11/2026) ---- */
  .cabecera-fila { display: flex; justify-content: space-between; align-items: center; }
  .estado { display: block; min-height: 16px; opacity: .85; font-size: 12px; }
  .link { background: none; border: 0; color: var(--acento); font: inherit; font-size: 14px; cursor: pointer; padding: 6px 0; }
  .link.claro { color: white; opacity: .9; }
  .link.centrado { display: block; margin: 6px auto 0; }
  .progreso { position: sticky; top: 0; z-index: 2; background: var(--fondo); padding: 6px 0 8px; margin-bottom: 6px; }
  .progreso-texto { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--suave); }
  .barra { height: 8px; background: var(--borde); border-radius: 999px; overflow: hidden; margin: 6px 0; }
  .barra div { height: 100%; background: var(--acento); transition: width .3s; }
  .botonera { display: grid; grid-template-columns: 64px 1fr; gap: 8px; }
  .botonera .boton { margin-top: 6px; }
  .boton:disabled { opacity: .4; cursor: default; }
  .boton.ya-hecho { background: #1f4d36; }
  .lista-ejercicios { padding: 4px 10px; }
  .item-ejercicio { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; background: none; border: 0;
    border-bottom: 1px solid var(--borde); padding: 10px 0; font: inherit; color: var(--texto); cursor: pointer; }
  .item-ejercicio:last-child { border-bottom: 0; }
  .item-ejercicio:disabled { cursor: default; color: var(--texto); }
  .item-ejercicio small { display: block; color: var(--suave); font-size: 13px; }
  .item-ejercicio .marca { flex: 0 0 28px; height: 28px; border-radius: 50%; background: var(--fondo); color: var(--suave);
    display: grid; place-items: center; font-size: 13px; font-weight: 600; }
  .item-ejercicio.hecho .marca { background: var(--acento-claro); color: var(--acento); font-size: 15px; }
  .felicitacion { text-align: center; padding: 20px 0 10px; }
  .felicitacion .grande { font-size: 48px; }
  .felicitacion h3 { font-size: 22px; margin: 6px 0 12px; }
  .centrado-flex { justify-content: center; }
  .login input { margin-top: 10px; }
  input.copiado { color: var(--suave); font-style: italic; } /* se llenó solo con la serie anterior */
  pre.resumen-texto { white-space: pre-wrap; font-size: 13px; background: var(--fondo); padding: 10px; border-radius: 8px; }
</style>

// Lista de etapas: la primera es la que se abre al entrar.
const RUTINAS = [ETAPA6, ADAPTACION];
// RUTINA = la etapa que se está mirando ahora. Cambia con el selector.
let RUTINA = RUTINAS[0];

/* =========================================================
   3) JAVASCRIPT: la "lógica". Lee los datos de arriba y
   construye la pantalla. Si cambiás los datos, cambia la app.
   ========================================================= */

// Une la prescripción del día con su ficha de la biblioteca.
// Lo que trae la prescripción pisa lo de la biblioteca ("..." = copiar todos los campos).
function resolver(prescripcion) {
  const ficha = BIBLIOTECA[prescripcion.id];
  if (!ficha) console.warn('Ejercicio sin ficha en la biblioteca:', prescripcion.id);
  return { ...ficha, ...prescripcion };
}

// Link provisorio de vídeo: busca el ejercicio en YouTube.
// Más adelante cada ejercicio de la biblioteca tendrá SU vídeo elegido por vos.
function linkVideo(nombre) {
  return "https://www.youtube.com/results?search_query=" + encodeURIComponent(nombre + " técnica");
}

// "¿Cómo se hace?": para qué sirve, pasos y, si las hay, secciones extra
// ("Está bien hecho si", "Error común"...). Si el ejercicio es nuevo, se abre solo.
function bloqueDescripcion(ej, etiqueta) {
  const d = ej.descripcion;
  if (!d) return '';
  return `
      <details${ej.nuevo ? ' open' : ''}>
        <summary>¿Cómo se hace?</summary>
        <p class="detalle"><b>${etiqueta}</b> ${d.musculos}</p>
        <ol>${d.pasos.map(p => `<li>${p}</li>`).join('')}</ol>
        ${(d.secciones || []).map(sec => `
          <div class="seccion-titulo">${sec.titulo}</div>
          <p class="detalle">${sec.texto}</p>`).join('')}
      </details>`;
}

const etiquetaNuevo = ej => ej.nuevo ? '<span class="etiqueta nuevo">NUEVO</span>' : '';

// Vídeos: los de la biblioteca si los hay; si no, búsqueda en YouTube
function enlacesVideo(ej) {
  const videos = (ej.videos && ej.videos.length) ? ej.videos : [linkVideo(ej.nombre)];
  return videos.map((url, k) => `<a class="video" href="${url}" target="_blank" rel="noopener">▶ Ver vídeo${videos.length > 1 ? ' ' + (k + 1) : ''}</a> `).join('');
}

// Dibuja un ejercicio del trabajo principal (con series, carga, RIR...)
function tarjetaPrincipal(ej, idEj) {
  return `
    <div class="tarjeta${ej.grupo ? ' en-grupo' : ''}">
      <h3>${ej.nombre}${etiquetaNuevo(ej)}${ej.destacado ? '<span class="etiqueta">PRINCIPAL</span>' : ''}${ej.grupo ? `<span class="etiqueta grupo">SUPERSERIE ${ej.grupo}</span>` : ''}</h3>
      ${ej.previo ? `<p class="detalle">${ej.previo}</p>` : ''}
      <div class="presc">
        <div><span>Series×Reps</span><b>${ej.series}×${ej.reps}</b></div>
        <div><span>Carga</span><b>${ej.carga}</b></div>
        <div><span>RIR</span><b>${ej.rir}</b></div>
        <div><span>Descanso</span><b>${ej.descanso}</b></div>
      </div>
      ${bloqueDescripcion(ej, 'Trabaja:')}
      <details>
        <summary>Indicaciones técnicas</summary>
        <ul>${ej.indicaciones.map(i => `<li>${i}</li>`).join('')}</ul>
      </details>
      ${enlacesVideo(ej)}
      ${formularioRegistro(ej, idEj)}
      ${camposAnotar(ej.anotar, idEj)}
    </div>`;
}

/* ---------------------------------------------------------
   FASE 2 · REGISTRO
   Cada ejercicio principal tiene una fila por serie
   (peso y reps) + el RIR de la última serie.
   --------------------------------------------------------- */
function formularioRegistro(ej, idEj) {
  const cantidadSeries = parseInt(ej.series) || 3;   // "4" → 4 ; "2-3" → 2
  const nombreSerie = ej.grupo ? 'Vuelta' : 'Serie'; // en una superserie hablamos de vueltas
  let filas = '';
  for (let s = 1; s <= cantidadSeries; s++) {
    filas += `
      <div class="fila-serie${ej.rirPorSerie ? ' con-rir' : ''}">
        <span>${nombreSerie} ${s}</span>
        <input inputmode="decimal" placeholder="kg" data-id="${idEj}-s${s}-peso">
        <input inputmode="numeric" placeholder="reps" data-id="${idEj}-s${s}-reps">
        ${ej.rirPorSerie ? `<input inputmode="numeric" placeholder="RIR" data-id="${idEj}-s${s}-rir">` : ''}
      </div>`;
  }
  // Si el ejercicio pide RIR en cada serie, no hace falta la fila de "RIR de la última"
  const filaRir = ej.rirPorSerie ? '' : `
      <div class="fila-rir">
        <span>RIR de la última ${nombreSerie.toLowerCase()}</span>
        <input inputmode="numeric" placeholder="RIR" data-id="${idEj}-rir">
      </div>`;
  return `
    <div class="registro">
      <div class="registro-titulo">📝 Lo que hiciste</div>
      ${filas}
      ${filaRir}
    </div>`;
}

/* ---------------------------------------------------------
   CAMPOS PARA ANOTAR (nuevo en el Día 5)
   Para lo que no son series × kg × reps: el nivel de la bici,
   los kg de la pesa rusa, los segundos del L-sit...
   Cada campo es un dato { etiqueta, placeholder }.
   --------------------------------------------------------- */
function camposAnotar(campos, idBase) {
  if (!campos) return '';
  return `
    <div class="registro">
      <div class="registro-titulo">📝 Anotá</div>
      ${campos.map((c, k) => `
        <div class="fila-anotar">
          <span>${c.etiqueta}</span>
          <input placeholder="${c.placeholder || ''}" data-id="${idBase}-a${k}">
        </div>`).join('')}
    </div>`;
}

// Dibuja un ejercicio simple (calentamiento, cardio, estiramientos)
function tarjetaSimple(ej, idEj) {
  return `
    <div class="tarjeta">
      <h3>${ej.nombre}${etiquetaNuevo(ej)}</h3>
      <p class="detalle"><b>${ej.dosis}</b>${ej.nota ? ' · ' + ej.nota : ''}</p>
      ${bloqueDescripcion(ej, 'Para qué:')}
      ${ej.indicaciones ? `
      <details>
        <summary>Indicaciones</summary>
        <ul>${ej.indicaciones.map(i => `<li>${i}</li>`).join('')}</ul>
      </details>` : ''}
      ${camposAnotar(ej.anotar, idEj)}
    </div>`;
}

/* =========================================================
   MODO ENTRENAMIENTO (24/11/2026)
   - El día se ve primero como resumen (reglas + lista de ejercicios).
   - "Empezar sesión" abre UN EJERCICIO POR PANTALLA con "✓ Hecho".
   - Todo lo que anota se guarda en Supabase a medida que entrena
     (y también en el móvil, por si se corta internet).
   ========================================================= */

// ---------- Guardar cosas en el móvil (localStorage) ----------
// try/catch: si el navegador no deja guardar, la app sigue funcionando igual.
function leerLocal(clave, porDefecto) {
  try { return JSON.parse(localStorage.getItem(clave)) || porDefecto; } catch (e) { return porDefecto; }
}
function guardarLocal(clave, valor) {
  try { localStorage.setItem(clave, JSON.stringify(valor)); } catch (e) {}
}

// BORRADOR: todo lo que Rodrigo escribe (kg, reps, notas...). Clave = data-id del campo.
let borrador = leerLocal('registro-rutina', {});
// SESIONES ABIERTAS: una por día que esté entrenando. Clave = "etapa6-fin-de-anio-d1".
let sesionesAbiertas = leerLocal('sesiones-abiertas', {});
// Si pasaron más de 6 horas, la sesión se da por terminada (la duración real
// la calcula la base con su última actividad: ver vista_sesiones).
const HORAS_SESION_VIEJA = 6;

function valor(id) { return (borrador[id] || '').toString().trim(); }

// Cada vez que escribe algo: lo guardamos en el borrador y, si hay sesión, en la base.
// COPIADOS: campos que se llenaron solos al copiar la serie anterior (se ven en otro tono).
let copiados = leerLocal('campos-copiados', {});

document.addEventListener('input', e => {
  const id = e.target.dataset.id;
  if (!id) return;
  if (e.target.value) borrador[id] = e.target.value; else delete borrador[id];
  delete copiados[id];              // lo escribió a mano: ya no es "copiado"
  e.target.classList.remove('copiado');
  copiarALasSiguientes(id, e.target.value);
  guardarLocal('registro-rutina', borrador);
  guardarLocal('campos-copiados', copiados);
  if (pantalla.tipo === 'paso') encolarEjercicioActual();
  if (pantalla.tipo === 'dia' && id.includes('-antes-')) encolarAntes(pantalla.indice);
});

// LA SERIE SIGUIENTE COPIA LA ANTERIOR: si en la serie 1 pone 65 kg, las series 2, 3 y 4
// se llenan con 65. Solo toca las que están vacías o que se habían llenado solas:
// lo que Rodrigo escribió a mano nunca se pisa. Vale para kg y reps (el RIR no se copia).
function copiarALasSiguientes(id, texto) {
  const m = id.match(/^(.*)-s(\d+)-(peso|reps)$/);
  if (!m || pantalla.tipo !== 'paso') return;
  const [, idEj, n, campo] = m;
  const { ej } = pasosDelDia(pantalla.indice)[pantalla.paso];
  const total = parseInt(ej.series) || 3;
  for (let s = parseInt(n) + 1; s <= total; s++) {
    const otro = `${idEj}-s${s}-${campo}`;
    if (valor(otro) && !copiados[otro]) break;   // escrito a mano: de acá en adelante no se toca
    if (texto) { borrador[otro] = texto; copiados[otro] = true; }
    else { delete borrador[otro]; delete copiados[otro]; }
    const input = document.querySelector(`[data-id="${otro}"]`);
    if (input) { input.value = texto; input.classList.toggle('copiado', !!texto); }
  }
}

function restaurarBorrador() {
  document.querySelectorAll('[data-id]').forEach(campo => {
    if (borrador[campo.dataset.id]) campo.value = borrador[campo.dataset.id];
    campo.classList.toggle('copiado', !!copiados[campo.dataset.id]);
  });
}

// ---------- Pasos del día: todos los ejercicios en fila ----------
// Cada paso sabe en qué bloque está (b), qué número de ejercicio es (e) y su "posicion" ("b1-e0"),
// que es lo que se guarda en la base para saber de qué ejercicio del día se trata.
function pasosDelDia(indice) {
  const dia = RUTINA.dias[indice];
  const base = `${RUTINA.id}-d${indice}`;
  const pasos = [];
  dia.bloques.forEach((bloque, b) => {
    bloque.ejercicios.map(resolver).forEach((ej, e) => {
      pasos.push({
        ej, bloque, b, e,
        posicion: `b${b}-e${e}`,
        idEj: `${base}-b${b}-e${e}`,
        primeroDelBloque: e === 0,
        ultimoDelBloque: e === bloque.ejercicios.length - 1
      });
    });
  });
  return pasos;
}

const claveDia = indice => `${RUTINA.id}-d${indice}`;
const sesionDe = indice => sesionesAbiertas[claveDia(indice)];
const fechaLocal = () => new Date().toLocaleDateString('sv-SE'); // "2026-11-24"

function limpiarSesionesViejas() {
  const limite = Date.now() - HORAS_SESION_VIEJA * 3600 * 1000;
  Object.entries(sesionesAbiertas).forEach(([clave, s]) => {
    if (new Date(s.inicio).getTime() < limite) {
      delete sesionesAbiertas[clave];
      borrarBorradorDelDia(clave);
    }
  });
  guardarLocal('sesiones-abiertas', sesionesAbiertas);
}

function borrarBorradorDelDia(clave) {
  Object.keys(borrador).forEach(id => { if (id.startsWith(clave + '-')) delete borrador[id]; });
  Object.keys(copiados).forEach(id => { if (id.startsWith(clave + '-')) delete copiados[id]; });
  guardarLocal('registro-rutina', borrador);
  guardarLocal('campos-copiados', copiados);
}

// ---------- Qué hay en pantalla ----------
let pantalla = { tipo: 'dia', indice: 0, paso: 0 };

function marcarPestana(indice) {
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('activa', i === indice));
}

// RESUMEN DEL DÍA: reglas, preguntas previas, lista de ejercicios y botón para empezar
function mostrarDia(indice) {
  pantalla = { tipo: 'dia', indice, paso: 0 };
  const dia = RUTINA.dias[indice];
  const base = claveDia(indice);
  const reglas = dia.reglas || RUTINA.reglas;
  const sesion = sesionDe(indice);
  const pasos = pasosDelDia(indice);

  let html = `<h3 class="titulo-dia">${dia.nombre}</h3>`;
  if (dia.objetivo) html += `<p>${dia.objetivo}</p>`;
  const chips = [];
  if (dia.duracion) chips.push(`⏱ ${dia.duracion}`);
  if (dia.intensidad) chips.push(`💪 ${dia.intensidad}`);
  chips.push(`📋 ${pasos.length} ejercicios`);
  html += `<div class="resumen">${chips.map(c => `<span class="chip">${c}</span>`).join('')}</div>`;

  html += `
    <h2>Antes de empezar</h2>
    <div class="tarjeta reglas"><ul>${reglas.map(r => `<li>${r}</li>`).join('')}</ul></div>`;
  if (dia.antes) html += `<div class="tarjeta">${camposAnotar(dia.antes, `${base}-antes`)}</div>`;

  // Botón principal: empezar o continuar
  if (sesion) {
    const hechos = Object.keys(sesion.hechos || {}).length;
    html += `<button class="boton" onclick="mostrarPaso(${indice}, ${sesion.paso || 0})">▶ Continuar sesión · ${hechos} de ${pasos.length} hechos</button>`;
  } else {
    html += `<button class="boton" onclick="empezarSesion(${indice})">▶ Empezar sesión</button>`;
  }

  // Lista de ejercicios agrupada por bloque (con ✓ en los ya hechos)
  dia.bloques.forEach((bloque, b) => {
    html += `<h2>${bloque.nombre}</h2>`;
    if (bloque.nota) html += `<p class="nota-bloque">${bloque.nota}</p>`;
    html += `<div class="tarjeta lista-ejercicios">`;
    pasos.filter(p => p.b === b).forEach(p => {
      const k = pasos.indexOf(p);
      const hecho = sesion && sesion.hechos && sesion.hechos[p.posicion];
      const dosis = p.bloque.principal ? `${p.ej.series}×${p.ej.reps} · ${p.ej.carga}` : (p.ej.dosis || '');
      html += `
        <button class="item-ejercicio${hecho ? ' hecho' : ''}" ${sesion ? `onclick="mostrarPaso(${indice}, ${k})"` : 'disabled'}>
          <span class="marca">${hecho ? '✓' : k + 1}</span>
          <span><b>${p.ej.grupo ? p.ej.grupo + ' · ' : ''}${p.ej.nombre}</b><small>${dosis}</small></span>
        </button>`;
    });
    html += `</div>`;
  });

  document.getElementById('contenido').innerHTML = html;
  restaurarBorrador();
  marcarPestana(indice);
  window.scrollTo(0, 0);
}

function empezarSesion(indice) {
  const dia = RUTINA.dias[indice];
  const sesion = {
    id: crypto.randomUUID(),          // el id lo crea el móvil: así funciona aunque no haya internet
    dia: dia.nombre,
    rutina_id: RUTINA.id,
    fecha: fechaLocal(),
    inicio: new Date().toISOString(),
    paso: 0,
    hechos: {}
  };
  sesionesAbiertas[claveDia(indice)] = sesion;
  guardarLocal('sesiones-abiertas', sesionesAbiertas);
  encolarSesion(sesion);
  encolarAntes(indice);
  mostrarPaso(indice, 0);
}

// UN EJERCICIO POR PANTALLA
function mostrarPaso(indice, k) {
  const sesion = sesionDe(indice);
  if (!sesion) return mostrarDia(indice);
  const pasos = pasosDelDia(indice);
  if (k >= pasos.length) return mostrarCierre(indice);
  k = Math.max(0, k);
  pantalla = { tipo: 'paso', indice, paso: k };
  sesion.paso = k;
  guardarLocal('sesiones-abiertas', sesionesAbiertas);

  const p = pasos[k];
  const hechos = Object.keys(sesion.hechos).length;
  const hecho = !!sesion.hechos[p.posicion];
  const porcentaje = Math.round(hechos / pasos.length * 100);

  let html = `
    <div class="progreso">
      <div class="progreso-texto"><span>${p.bloque.nombre}</span><span>${k + 1} de ${pasos.length}</span></div>
      <div class="barra"><div style="width:${porcentaje}%"></div></div>
      <div class="progreso-texto"><small>✓ ${hechos} hechos</small><button class="link" onclick="mostrarDia(${indice})">☰ Ver todos</button></div>
    </div>`;
  if (p.primeroDelBloque && p.bloque.nota) html += `<p class="nota-bloque">${p.bloque.nota}</p>`;
  if (p.primeroDelBloque && p.bloque.reglas) html += `<div class="tarjeta reglas"><ul>${p.bloque.reglas.map(r => `<li>${r}</li>`).join('')}</ul></div>`;
  html += p.bloque.principal ? tarjetaPrincipal(p.ej, p.idEj) : tarjetaSimple(p.ej, p.idEj);
  if (p.ultimoDelBloque && p.bloque.cierre) html += `<div class="tarjeta cierre"><b>${p.bloque.cierre.titulo}</b>${p.bloque.cierre.texto}</div>`;

  html += `
    <div class="botonera">
      <button class="boton secundario" onclick="mostrarPaso(${indice}, ${k - 1})" ${k === 0 ? 'disabled' : ''}>←</button>
      <button class="boton${hecho ? ' ya-hecho' : ''}" onclick="marcarHecho(${indice}, ${k})">${hecho ? '✓ Hecho · siguiente' : '✓ Hecho'}</button>
    </div>
    <button class="link centrado" onclick="mostrarPaso(${indice}, ${k + 1})">${k === pasos.length - 1 ? 'Ir al cierre →' : 'Saltear por ahora →'}</button>
    ${hecho ? `<button class="link centrado" onclick="desmarcarHecho(${indice}, ${k})">Desmarcar</button>` : ''}`;

  document.getElementById('contenido').innerHTML = html;
  restaurarBorrador();
  // En el principal, los detalles de técnica se abren solos: es lo que más se consulta
  marcarPestana(indice);
  window.scrollTo(0, 0);
}

function marcarHecho(indice, k) {
  const sesion = sesionDe(indice);
  const p = pasosDelDia(indice)[k];
  if (!sesion.hechos[p.posicion]) {
    sesion.hechos[p.posicion] = new Date().toISOString();
    guardarLocal('sesiones-abiertas', sesionesAbiertas);
    encolar(`hecho|${sesion.id}|${p.posicion}`, {
      tabla: 'ejercicios_hechos', conflicto: 'sesion_id,posicion',
      fila: { sesion_id: sesion.id, posicion: p.posicion, ejercicio_id: p.ej.id, hecho_en: sesion.hechos[p.posicion] }
    });
  }
  mostrarPaso(indice, k + 1);
}

function desmarcarHecho(indice, k) {
  const sesion = sesionDe(indice);
  const p = pasosDelDia(indice)[k];
  delete sesion.hechos[p.posicion];
  guardarLocal('sesiones-abiertas', sesionesAbiertas);
  encolar(`hecho|${sesion.id}|${p.posicion}`, {
    tabla: 'ejercicios_hechos', borrar: { sesion_id: sesion.id, posicion: p.posicion }
  });
  mostrarPaso(indice, k);
}

// CIERRE: cómo se sintió, resumen y "Terminar sesión"
function mostrarCierre(indice) {
  const sesion = sesionDe(indice);
  if (!sesion) return mostrarDia(indice);
  pantalla = { tipo: 'cierre', indice, paso: 0 };
  const pasos = pasosDelDia(indice);
  const hechos = Object.keys(sesion.hechos).length;
  const faltan = pasos.map((p, k) => ({ p, k })).filter(({ p }) => !sesion.hechos[p.posicion]);
  const base = claveDia(indice);

  let html = `<h3 class="titulo-dia">Cierre de la sesión</h3>
    <div class="resumen">
      <span class="chip">✓ ${hechos} de ${pasos.length} ejercicios</span>
      <span class="chip">⏱ ${minutosDesde(sesion.inicio)} min</span>
    </div>`;
  if (faltan.length) {
    html += `<div class="tarjeta"><div class="registro-titulo">Quedaron sin marcar</div>
      ${faltan.map(({ p, k }) => `<button class="item-ejercicio" onclick="mostrarPaso(${indice}, ${k})"><span class="marca">${k + 1}</span><span><b>${p.ej.nombre}</b><small>${p.bloque.nombre}</small></span></button>`).join('')}
    </div>`;
  }
  html += `
    <div class="tarjeta">
      <div class="registro-titulo">¿Cómo te sentiste? ¿Alguna molestia?</div>
      <textarea placeholder="Ej: buena sesión, banca cómoda, algo de carga en el hombro izquierdo…" data-id="${base}-nota"></textarea>
      <button class="boton" onclick="terminarSesion(${indice})">Terminar sesión</button>
      <button class="boton secundario" onclick="mostrarPaso(${indice}, ${pasos.length - 1})">← Volver al último ejercicio</button>
    </div>`;
  document.getElementById('contenido').innerHTML = html;
  restaurarBorrador();
  window.scrollTo(0, 0);
}

function minutosDesde(iso) { return Math.max(1, Math.round((Date.now() - new Date(iso).getTime()) / 60000)); }

function terminarSesion(indice) {
  const sesion = sesionDe(indice);
  const base = claveDia(indice);
  const pasos = pasosDelDia(indice);
  const texto = generarResumen(indice);
  const hechos = Object.keys(sesion.hechos).length;
  const minutos = minutosDesde(sesion.inicio);
  const series = pasos.filter(p => p.bloque.principal)
    .reduce((n, p) => n + Array.from({ length: parseInt(p.ej.series) || 3 }, (_, s) => valor(`${p.idEj}-s${s + 1}-peso`) || valor(`${p.idEj}-s${s + 1}-reps`)).filter(Boolean).length, 0);

  sesion.fin = new Date().toISOString();
  sesion.nota = valor(`${base}-nota`) || null;
  encolarSesion(sesion);
  // La sesión se cierra: el próximo martes arranca en limpio (lo de hoy ya está en la base)
  delete sesionesAbiertas[base];
  guardarLocal('sesiones-abiertas', sesionesAbiertas);
  borrarBorradorDelDia(base);
  pantalla = { tipo: 'fin', indice, paso: 0 };

  document.getElementById('contenido').innerHTML = `
    <div class="felicitacion">
      <div class="grande">🎉</div>
      <h3>¡Sesión completa!</h3>
      <div class="resumen centrado-flex">
        <span class="chip">⏱ ${minutos} min</span>
        <span class="chip">✓ ${hechos} de ${pasos.length} ejercicios</span>
        <span class="chip">📝 ${series} series anotadas</span>
      </div>
      <p class="detalle">${usuario ? 'Tus registros se guardan solos (si no hay internet, apenas vuelva).' : 'Mandale el resumen a tu entrenador.'}</p>
    </div>
    <div class="tarjeta">
      <div class="registro-titulo">Resumen (respaldo por WhatsApp)</div>
      <pre class="resumen-texto" id="resumen-texto"></pre>
      <button class="boton secundario" id="boton-copiar">Copiar para enviar por WhatsApp</button>
    </div>
    <button class="boton" onclick="mostrarDia(${indice})">Volver al día</button>`;
  // textContent (y no innerHTML) para que lo que escribe Rodrigo se muestre tal cual, sin interpretarse como código
  document.getElementById('resumen-texto').textContent = texto;
  document.getElementById('boton-copiar').onclick = async () => {
    const boton = document.getElementById('boton-copiar');
    try { await navigator.clipboard.writeText(texto); boton.textContent = '✓ Copiado'; }
    catch (e) { boton.textContent = 'No se pudo copiar: mantené apretado el texto de arriba'; }
  };
  window.scrollTo(0, 0);
}

/* ---------------------------------------------------------
   RESUMEN de texto para WhatsApp (respaldo). Lee del borrador.
   --------------------------------------------------------- */
function generarResumen(indice) {
  const dia = RUTINA.dias[indice];
  const base = claveDia(indice);
  const sesion = sesionDe(indice);
  const fecha = new Date().toLocaleDateString('es-ES');
  let texto = `${CLIENTE} · ${RUTINA.etapa} · ${dia.nombre} · ${fecha}`;
  if (sesion) texto += `\n⏱ ${minutosDesde(sesion.inicio)} min · ✓ ${Object.keys(sesion.hechos).length} de ${pasosDelDia(indice).length} ejercicios`;
  texto += '\n';

  const lineasAnotadas = (campos, idBase) => (campos || [])
    .map((c, k) => [c.etiqueta, valor(`${idBase}-a${k}`)])
    .filter(([, v]) => v)
    .map(([etiqueta, v]) => `\n• ${etiqueta}: ${v}`).join('');

  texto += lineasAnotadas(dia.antes, `${base}-antes`);

  pasosDelDia(indice).forEach(({ ej, bloque, idEj }) => {
    if (!bloque.principal) {
      const anotado = lineasAnotadas(ej.anotar, idEj);
      if (anotado) texto += `\n${ej.nombre}${anotado.replace(/\n• /g, '\n   – ')}`;
      return;
    }
    const series = [];
    for (let s = 1; s <= (parseInt(ej.series) || 3); s++) {
      const peso = valor(`${idEj}-s${s}-peso`);
      const reps = valor(`${idEj}-s${s}-reps`);
      const rirSerie = ej.rirPorSerie ? valor(`${idEj}-s${s}-rir`) : '';
      if (peso || reps) series.push(`${peso || '?'}×${reps || '?'}${rirSerie ? ` (RIR ${rirSerie})` : ''}`);
    }
    const rir = valor(`${idEj}-rir`);
    const prefijo = ej.grupo ? `${ej.grupo} ` : '';
    texto += `\n• ${prefijo}${ej.nombre}: ${series.length ? series.join(', ') : 'sin datos'}`;
    if (rir) texto += ` · RIR ${rir}`;
    const anotado = lineasAnotadas(ej.anotar, idEj);
    if (anotado) texto += anotado.replace(/\n• /g, '\n   – ');
  });

  const nota = valor(`${base}-nota`);
  if (nota) texto += `\n\nNotas: ${nota}`;
  return texto;
}

/* =========================================================
   GUARDADO EN SUPABASE
   Cada cambio se pone en una "cola" (también guardada en el móvil).
   La cola se manda a la base apenas se puede; si no hay internet,
   espera y lo reintenta. Clave de la cola = qué dato es: si Rodrigo
   corrige un número antes de que se mande, solo viaja el último.
   ========================================================= */
let cola = leerLocal('cola-guardado', {});
let sincronizando = false;
let temporizador = null;

function encolar(clave, operacion) {
  operacion.orden = operacion.tabla === 'sesiones' ? 0 : 1; // primero la sesión, después lo demás
  cola[clave] = operacion;
  guardarLocal('cola-guardado', cola);
  clearTimeout(temporizador);
  temporizador = setTimeout(sincronizar, 700);
  mostrarEstado();
}

function encolarSesion(s) {
  encolar(`sesion|${s.id}`, {
    tabla: 'sesiones', conflicto: 'id',
    fila: { id: s.id, dia: s.dia, rutina_id: s.rutina_id, fecha: s.fecha, inicio: s.inicio, fin: s.fin || null, nota: s.nota || null }
  });
}

const numero = t => { const n = parseFloat((t || '').replace(',', '.')); return isNaN(n) ? null : n; };
const entero = t => { const n = parseInt(t || '', 10); return isNaN(n) || n < 0 || n > 999 ? null : n; };

// Series y campos anotados del ejercicio que está en pantalla
function encolarEjercicioActual() {
  const { indice, paso } = pantalla;
  const sesion = sesionDe(indice);
  if (!sesion) return;
  const p = pasosDelDia(indice)[paso];
  const { ej, idEj, posicion, bloque } = p;

  if (bloque.principal) {
    const total = parseInt(ej.series) || 3;
    for (let s = 1; s <= total; s++) {
      const kg = numero(valor(`${idEj}-s${s}-peso`));
      const reps = entero(valor(`${idEj}-s${s}-reps`));
      // RIR: el de cada serie, o el "RIR de la última" va en la última serie
      const rir = ej.rirPorSerie ? entero(valor(`${idEj}-s${s}-rir`)) : (s === total ? entero(valor(`${idEj}-rir`)) : null);
      const clave = `serie|${sesion.id}|${posicion}|${s}`;
      if (kg === null && reps === null && rir === null) {
        encolar(clave, { tabla: 'series', borrar: { sesion_id: sesion.id, posicion, numero: s } });
      } else {
        encolar(clave, {
          tabla: 'series', conflicto: 'sesion_id,posicion,numero',
          fila: { sesion_id: sesion.id, posicion, ejercicio_id: ej.id, numero: s, kg, reps, rir, registrada_en: new Date().toISOString() }
        });
      }
    }
  }
  encolarAnotaciones(sesion, ej.anotar, idEj, posicion, ej.id);
}

function encolarAntes(indice) {
  const sesion = sesionDe(indice);
  if (!sesion) return;
  encolarAnotaciones(sesion, RUTINA.dias[indice].antes, `${claveDia(indice)}-antes`, 'antes', null);
}

function encolarAnotaciones(sesion, campos, idBase, posicion, ejercicioId) {
  (campos || []).forEach((c, k) => {
    const v = valor(`${idBase}-a${k}`);
    const clave = `anota|${sesion.id}|${posicion}|${c.etiqueta}`;
    if (!v) encolar(clave, { tabla: 'anotaciones', borrar: { sesion_id: sesion.id, posicion, etiqueta: c.etiqueta } });
    else encolar(clave, {
      tabla: 'anotaciones', conflicto: 'sesion_id,posicion,etiqueta',
      fila: { sesion_id: sesion.id, posicion, ejercicio_id: ejercicioId, etiqueta: c.etiqueta, valor: v, registrada_en: new Date().toISOString() }
    });
  });
}

async function sincronizar() {
  if (!db || !usuario || sincronizando) return mostrarEstado();
  sincronizando = true;
  mostrarEstado();
  const claves = Object.keys(cola).sort((a, b) => cola[a].orden - cola[b].orden);
  let hayError = false;
  for (const clave of claves) {
    const op = cola[clave];
    let consulta;
    if (op.borrar) {
      consulta = db.from(op.tabla).delete();
      Object.entries(op.borrar).forEach(([col, v]) => { consulta = consulta.eq(col, v); });
    } else {
      consulta = db.from(op.tabla).upsert(op.fila, { onConflict: op.conflicto });
    }
    const { error } = await consulta;
    if (!error) {
      if (cola[clave] === op) delete cola[clave]; // si cambió mientras viajaba, queda la versión nueva
    } else if (/^(22|23)/.test(error.code || '')) {
      // Dato inválido (ej.: un número imposible): no se puede guardar nunca, se descarta
      console.warn('Dato descartado', clave, error.message);
      delete cola[clave];
    } else {
      console.warn('No se pudo guardar (se reintenta)', clave, error.message);
      hayError = true;
      if (op.tabla === 'sesiones') break; // sin la sesión no tiene sentido mandar lo demás
    }
  }
  guardarLocal('cola-guardado', cola);
  sincronizando = false;
  mostrarEstado(hayError);
  if (hayError) { clearTimeout(temporizador); temporizador = setTimeout(sincronizar, 15000); }
}
window.addEventListener('online', sincronizar);

function mostrarEstado(hayError) {
  const el = document.getElementById('estado-guardado');
  if (!el) return;
  const pendientes = Object.keys(cola).length;
  if (!db) el.textContent = '';
  else if (!usuario) el.textContent = '';
  else if (sincronizando) el.textContent = 'Guardando…';
  else if (pendientes && (hayError || !navigator.onLine)) el.textContent = '⚠ Sin conexión: se guarda al volver';
  else if (pendientes) el.textContent = 'Guardando…';
  else el.textContent = '✓ Guardado';
}

/* =========================================================
   INICIO DE SESIÓN (Supabase Auth)
   La clave de abajo es PÚBLICA a propósito: sirve solo para hablar con
   la base. Lo que protege los datos son las reglas de seguridad (RLS):
   cada cliente ve solo lo suyo y el entrenador lee todo.
   ========================================================= */
const SUPABASE_URL = "https://kuvnqilwqtlfwwuicgaj.supabase.co";
const SUPABASE_CLAVE_PUBLICA = "sb_publishable_TH3ltV5QHyN_xq0T5aLLOA_zZG4Hbvx";
const db = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_CLAVE_PUBLICA) : null;
let usuario = null;

function mostrarLogin(mensaje) {
  document.getElementById('tabs').hidden = true;
  document.getElementById('selector-etapa').hidden = true;
  document.getElementById('contenido').innerHTML = `
    <div class="tarjeta login">
      <h3>Entrá a tu rutina</h3>
      <p class="detalle">Con el email y la contraseña que te pasó tu entrenador.</p>
      <form id="form-login">
        <input type="email" id="login-email" placeholder="Email" autocomplete="username" required>
        <input type="password" id="login-clave" placeholder="Contraseña" autocomplete="current-password" required>
        <button class="boton" type="submit">Entrar</button>
        <p class="aviso" id="login-error">${mensaje || ''}</p>
      </form>
    </div>`;
  document.getElementById('form-login').onsubmit = async e => {
    e.preventDefault();
    const boton = e.target.querySelector('button');
    boton.disabled = true; boton.textContent = 'Entrando…';
    const { data, error } = await db.auth.signInWithPassword({
      email: document.getElementById('login-email').value.trim(),
      password: document.getElementById('login-clave').value
    });
    if (error) {
      boton.disabled = false; boton.textContent = 'Entrar';
      document.getElementById('login-error').textContent =
        /invalid/i.test(error.message) ? 'Email o contraseña incorrectos.' : 'No se pudo entrar. Revisá tu conexión e intentá de nuevo.';
      return;
    }
    entrar(data.user);
  };
}

function entrar(user) {
  usuario = user;
  document.getElementById('tabs').hidden = false;
  document.getElementById('selector-etapa').hidden = false;
  document.getElementById('boton-salir').hidden = false;
  elegirEtapa(RUTINAS[0].id);
  sincronizar();
}

async function salir() {
  if (Object.keys(cola).length && !confirm('Hay datos que todavía no se guardaron. ¿Salir igual?')) return;
  await db.auth.signOut();
  usuario = null;
  document.getElementById('boton-salir').hidden = true;
  mostrarLogin();
}

/* ---------------------------------------------------------
   VISTA BIBLIOTECA (para el entrenador): se abre con #biblioteca al final del link.
   Muestra cada ejercicio con sus características y en qué días se usa.
   --------------------------------------------------------- */
function usosDe(id) {
  const usos = [];
  RUTINAS.forEach(r => r.dias.forEach(d => d.bloques.forEach(b => b.ejercicios.forEach(p => {
    if (p.id === id) usos.push(`${r.etapa.split(' · ')[0]} · ${d.nombre.split(' · ')[0]}`);
  }))));
  return [...new Set(usos)];
}

function mostrarBiblioteca() {
  const filtro = (document.getElementById('filtro-biblio') || {}).value || '';
  const ids = Object.keys(BIBLIOTECA);
  const categorias = [...new Set(ids.map(id => BIBLIOTECA[id].categoria))];
  const pasa = (id, f) => {
    const e = BIBLIOTECA[id];
    return !f || [id, e.nombre, e.familia, e.categoria, e.musculos, ...e.patron, ...e.material, ...e.precauciones.etiquetas]
      .join(' ').toLowerCase().includes(f.toLowerCase());
  };
  let html = `<h3 class="titulo-dia">Biblioteca · ${ids.length} ejercicios</h3>
    <p class="detalle">Buscá por nombre, patrón, material, músculo o precaución (ej: "bisagra", "lumbar", "mancuernas").</p>
    <input id="filtro-biblio" placeholder="Buscar…" value="${filtro}" oninput="mostrarBiblioteca()">`;
  categorias.forEach(cat => {
    const lista = ids.filter(id => BIBLIOTECA[id].categoria === cat && pasa(id, filtro));
    if (!lista.length) return;
    html += `<h2>${cat} · ${lista.length}</h2>`;
    lista.forEach(id => {
      const e = BIBLIOTECA[id];
      const chips = [...e.patron.map(p => '↗ ' + p), ...e.material.map(m => '⚙ ' + m), ...e.precauciones.etiquetas.map(p => '⚠ ' + p)];
      html += `<div class="tarjeta">
        <h3>${e.nombre}${e.revisar ? '<span class="etiqueta nuevo">REVISAR</span>' : ''}</h3>
        <p class="detalle"><code>${id}</code>${e.familia ? ' · familia: <b>' + e.familia + '</b>' : ''}</p>
        <p class="detalle">${e.musculos}</p>
        ${chips.length ? `<div class="resumen" style="margin:8px 0 0">${chips.map(c => `<span class="chip">${c}</span>`).join('')}</div>` : ''}
        ${e.precauciones.nota ? `<p class="detalle">⚠ ${e.precauciones.nota}</p>` : ''}
        <p class="detalle">Se usa en: ${usosDe(id).join(', ') || '—'}</p>
        ${bloqueDescripcion(e, 'Para qué:')}
      </div>`;
    });
  });
  document.getElementById('contenido').innerHTML = html;
  const campo = document.getElementById('filtro-biblio');
  campo.focus(); campo.setSelectionRange(filtro.length, filtro.length);
}

// Cambiar de etapa: actualiza la cabecera y las pestañas y abre el día que toca
function elegirEtapa(id) {
  RUTINA = RUTINAS.find(r => r.id === id) || RUTINAS[0];
  document.getElementById('etapa-subtitulo').textContent = RUTINA.fechas;
  document.getElementById('selector-etapa').value = RUTINA.id;
  document.getElementById('tabs').innerHTML = RUTINA.dias
    .map((d, i) => `<button class="tab" onclick="mostrarDia(${i})">${d.nombre.split(' · ')[0]}</button>`)
    .join('');
  mostrarDia(diaQueToca());
}

// Abre el día con una sesión en curso; si no hay, el de hoy ("Martes · ..." un martes); si no, el primero.
function diaQueToca() {
  const enCurso = RUTINA.dias.findIndex((d, i) => sesionDe(i));
  if (enCurso >= 0) return enCurso;
  const hoy = new Date().toLocaleDateString('es-ES', { weekday: 'long' }).toLowerCase();
  const deHoy = RUTINA.dias.findIndex(d => d.nombre.toLowerCase().startsWith(hoy));
  return deHoy >= 0 ? deHoy : 0;
}

// Arranque: nombre del cliente, opciones del selector y, si no hay sesión iniciada, el login
(async function arrancar() {
  document.getElementById('cliente').textContent = CLIENTE;
  document.getElementById('selector-etapa').innerHTML = RUTINAS
    .map(r => `<option value="${r.id}">${r.etapa}</option>`).join('');
  limpiarSesionesViejas();
  if (location.hash === '#biblioteca') {
    document.getElementById('etapa-subtitulo').textContent = 'Vista del entrenador';
    document.getElementById('cliente').textContent = 'Biblioteca de ejercicios';
    document.getElementById('selector-etapa').hidden = true;
    mostrarBiblioteca();
    return;
  }
  if (!db) {
    // Sin conexión con la base (ej.: no cargó la librería): la app funciona igual y queda el resumen por WhatsApp
    elegirEtapa(RUTINAS[0].id);
    document.getElementById('estado-guardado').textContent = '⚠ Sin conexión con la base: usá el resumen por WhatsApp';
    return;
  }
  const { data } = await db.auth.getSession();
  if (data.session) entrar(data.session.user); else mostrarLogin();
})();
</script>
